# This is a basic workflow to help you get started with Actions

name: Build docker Images

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [ master, develop ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      image_tag: ${{ github.ref_name == 'master' && 'latest' || 'dev' }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "11"
        cache: maven

    - name: Build with Maven
      run: mvn -B -ntp -f ./Server/pom.xml package

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Front Build and push Docker images
      uses: docker/build-push-action@v6
      with:
        context: ./Front
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/nfe-front:${{ env.image_tag }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Server Build and push Docker images
      uses: docker/build-push-action@v6
      with:
        context: ./Server
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/nfe-server:${{ env.image_tag }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
